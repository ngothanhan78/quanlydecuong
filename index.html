<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Đề cương — HUFI KCNHH</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- App content here -->
  <div id="app"></div>

  <!-- ══ SCRIPT LOAD ORDER — QUAN TRỌNG ══════════════════════════
       1. environment.config.js  — hằng số môi trường (GAS URL...)
       2. field-schema.js        — NGUỒN SỰ THẬT (load TRƯỚC tất cả)
       3. rbac.js                — phân quyền (cần schema)
       4. api.js                 — giao tiếp GAS
       5. calc.js                — tính toán (đọc FIELD_SCHEMA)
       6. dynamic-rows.js        — bảng động (đọc DYNAMIC_TABLES)
       7. form.js                — thu thập dữ liệu (đọc cả hai)
       8. export-word.js         — xuất Word (đọc cả hai)
       9. auth.js                — UI đăng nhập
      10. app.js                 — khởi tạo app (load CUỐI CÙNG)
  ════════════════════════════════════════════════════════════════ -->

  <!-- 1. Config môi trường -->
  <script src="config/environment.config.js"></script>

  <!-- 2. Schema — PHẢI load trước tất cả JS khác -->
  <script src="data/field-schema.js"></script>

  <!-- 3-8. Các module -->
  <script src="js/rbac.js"></script>
  <script src="js/api.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/dynamic-rows.js"></script>
  <script src="js/form.js"></script>
  <script src="js/export-word.js"></script>

  <!-- 9-10. Auth và App khởi tạo cuối -->
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <!-- Module scripts -->
  <script src="modules/admin/admin.js"></script>
  <script src="modules/tonghop/tonghop.js"></script>

</body>
</html>
